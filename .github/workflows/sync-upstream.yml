name: sync-upstream
on:
  schedule:
    - cron: '17 * * * *' # hourly poll - closest to upstream push (no webhook from xai-org)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/xai-org/grok-build.git 2>/dev/null || true
          git fetch upstream main
          git fetch origin main
          git checkout main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up-to-date"
            exit 0
          fi
          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
          else
            git rebase upstream/main
          fi
          git push origin main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build -p xai-grok-pager-bin --locked
      - run: cargo test --workspace --locked --quiet || true
