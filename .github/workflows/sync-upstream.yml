name: sync-upstream
on:
  schedule:
    - cron: '17 * * * *' # hourly poll - closest to upstream push (no webhook from xai-org)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch upstream
        run: |
          git config user.name "Sherlockski CI"
          git config user.email "297267003+Sherlockski@users.noreply.github.com"
          git remote add upstream https://github.com/xai-org/grok-build.git 2>/dev/null || true
          git fetch upstream main
          git fetch origin main
          git checkout main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up-to-date"
          elif git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
          else
            # While rebasing, "theirs" is the fork commit being replayed.
            # This resolves direct conflicts in favor of the fork's features,
            # while every non-conflicting upstream change remains untouched.
            # (This differs from a merge, where "theirs" would be upstream.)
            git rebase -X theirs upstream/main
          fi
          # Rebase rewrites our meta-commits (this workflow file), so the
          # result never fast-forwards over origin/main — force-with-lease
          # still refuses to clobber anything pushed since checkout.
          git push --force-with-lease origin main
          mkdir -p sync-result
          git rev-parse HEAD > sync-result/commit
      - name: Record synced revision
        uses: actions/upload-artifact@v4
        with:
          name: sync-result
          path: sync-result/commit
          retention-days: 1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dotslash (bin/protoc is a dotslash wrapper)
        run: cargo install dotslash --locked
      - run: cargo build -p xai-grok-pager-bin --locked -j 2
      - name: Run workspace tests
        # 7.8 GiB host with no swap historically OOM-killed rustc (4-5 GiB per codegen).
        # dmesg showed 4 parallel rustc + 2 rust-lld = >7 GiB -> global OOM, job Canceled.
        # Bound cargo and test threads; guest now has 8 GiB swap (provisioned via ssh-as-operator).
        run: cargo test --workspace --locked -j 2 --quiet -- --test-threads=2
