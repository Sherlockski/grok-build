# Aura Dark — daltonmenezes/aura-theme (https://github.com/daltonmenezes/aura-theme)
#
# Sources (verbatim hexes):
#   - packages/color-palettes/aura-colors.css   (--black #15141b, purple/pink/blue/red/orange/green)
#   - packages/vscode/themes/aura-dark-color-theme.json
#       editor.background            #15141b  -> bg_base / bg_terminal / md_code_bg base
#       sideBar.background           #110f18  -> bg_dark (sunken)
#       titleBar/editorWidget        #121016  -> scrollbar_bg / paste_bg
#       list.activeSelection         #2e2b38  -> bg_light (user prompt block band)
#       list.hover/focus             #3b334b  -> bg_highlight / bg_hover / hover_border
#       editor.selectionBackground   #3d375e7f -> bg_visual / selection_border (alpha composited over #15141b)
#       scrollbarSlider.background   #a394f033 -> scrollbar_fg (#312e46 composite)
#       inputOption.activeBorder     #a277ff  -> prompt_border_active
#       dropdown.foreground          #cdccce  -> text_secondary / paste_fg
#       statusBar.foreground         #adacae  -> gray_bright
#       activityBar.inactiveForeground #525156 -> accent_tool
#       tree.indentGuidesStroke      #4d4d4d  -> gray_dim / diff_gutter_fg
#       diffEditor.insertedTextBackground  #00d89023 -> diff_insert_bg (#122c29 composite)
#       diffEditor.removedTextBackground   #ff474720 -> diff_delete_bg (#321a25 composite)

[meta]
display = "Aura"
description = "Dark purple — aura theme port (daltonmenezes/aura-theme)."
requires_truecolor = true

[theme]
bg_base = "#15141b"
bg_light = "#2e2b38"
bg_dark = "#110f18"
bg_highlight = "#3b334b"
bg_hover = "#3b334b"
bg_terminal = "#15141b"

accent_user = "#a277ff"
accent_assistant = "#f694ff"
accent_thinking = "#6d6d6d"
accent_tool = "#525156"
accent_system = "#82e2ff"
accent_error = "#ff6767"
accent_success = "#61ffca"
accent_running = "#a277ff"
accent_skill = "#f694ff"

text_primary = "#edecee"
text_secondary = "#cdccce"

gray_dim = "#4d4d4d"
gray = "#6d6d6d"
gray_bright = "#adacae"

command = "#ffca85"
path = "#82e2ff"
running = "#61ffca"
warning = "#ffca85"

fuzzy_accent = "#a277ff"
accent_plan = "#ffca85"
accent_verify = "#a277ff"
accent_remember = "#61ffca"

selection_border = "#3d375e"
hover_border = "#3b334b"
prompt_border = "#3b334b"
prompt_border_active = "#a277ff"

accent_model = "#61ffca"

scrollbar_bg = "#121016"
scrollbar_fg = "#312e46"

diff_delete_bg = "#321a25"
diff_delete_fg = "#ff6767"
diff_insert_bg = "#122c29"
diff_insert_fg = "#61ffca"
diff_equal_fg = "#6d6d6d"
diff_gutter_fg = "#4d4d4d"

bg_visual = "#3d375e"

paste_bg = "#121016"
paste_fg = "#cdccce"
paste_dim = "#6d6d6d"

md_heading_h1 = "#a277ff"
